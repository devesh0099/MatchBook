# Web node only. Nothing containerized ever touches the benchmark node — a
# container runtime doing background work during a ranked measurement is exactly
# what the node was bought to avoid. Pool and bench run plain systemd units.

name: me-platform

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Browser talks to the API through Caddy on the same origin.
      NEXT_PUBLIC_API_BASE: /api
    expose:
      - "3000"
    depends_on: [api]

  api:
    build:
      context: ..
      dockerfile: platform/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mebench:mebench@postgres:5432/mebench
      REDIS_URL: redis://redis:6379
      # The public listener. The operator router is a SEPARATE axum Router on
      # its own listener bound to 127.0.0.1 and reached over an SSH tunnel —
      # that is the entire auth story (impl spec section 3).
      BIND_ADDR: 0.0.0.0:8080
      ADMIN_BIND_ADDR: 127.0.0.1:8081
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      S3_BUCKET: ${S3_BUCKET:-me-platform-artifacts}
    expose:
      - "8080"
    ports:
      # Admin is published to loopback only, never to the world.
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    # Pinned to 16 deliberately; do not let dev drift onto whatever the host
    # happens to have installed.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mebench
      POSTGRES_PASSWORD: mebench
      POSTGRES_DB: mebench
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mebench -d mebench"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    # Leaderboard read model only. Never a queue, never a source of truth, so
    # no persistence is configured: it is rebuilt from Postgres in one query.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
