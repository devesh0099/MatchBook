# Web node only. Nothing containerized ever touches the benchmark node — a
# container runtime doing background work during a ranked measurement is exactly
# what the node was bought to avoid. Pool and bench run plain systemd units.

name: me-platform

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  web:
    build:
      # Repo root: the frontend's build step reads engine/ and spec/ to generate
      # the editor's starting buffer and the header tabs.
      context: ..
      dockerfile: platform/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Browser talks to the API through Caddy on the same origin.
      NEXT_PUBLIC_API_BASE: /api
    expose:
      - "3000"
    depends_on: [api]

  api:
    build:
      context: ..
      dockerfile: platform/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mebench:${POSTGRES_PASSWORD:-mebench}@postgres:5432/mebench
      REDIS_URL: redis://redis:6379
      # The operator router is a SEPARATE axum Router on its own listener,
      # reachable only through an SSH tunnel to this host. That is the entire
      # auth story (impl spec section 3) — but WHERE the loopback restriction
      # lives changes once it is containerised, and getting that wrong makes it
      # unreachable rather than exposed.
      #
      # Binding 127.0.0.1 INSIDE the container binds the container's own
      # loopback. Docker forwards a published port to the container's bridge
      # address, not to its loopback, so nothing outside could reach the admin
      # port at all: `POST /admin/freeze` and `/admin/bench/unhealthy` — the two
      # things an operator needs most — silently did not work.
      #
      # So the container binds all interfaces and the HOST PUBLISH below is what
      # restricts it. The `127.0.0.1:` prefix on the ports entry is now
      # load-bearing: drop it and every operator route is open to the room, with
      # no password anywhere to stop it.
      BIND_ADDR: 0.0.0.0:8080
      ADMIN_BIND_ADDR: 0.0.0.0:8081
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      S3_BUCKET: ${S3_BUCKET:-me-platform-artifacts}
    expose:
      - "8080"
    ports:
      # Admin is published to the HOST's loopback only, never to the world.
      # This line is the access control; see ADMIN_BIND_ADDR above.
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    # Pinned to 16 deliberately; do not let dev drift onto whatever the host
    # happens to have installed.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mebench
      # Loopback-only by default, so the default password is harmless. The
      # moment DB_BIND below exposes this to the VPC it stops being harmless —
      # set POSTGRES_PASSWORD before the first `up`, because it is only read
      # when the cluster is initialised.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mebench}
      POSTGRES_DB: mebench
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      # The pool and bench nodes are separate EC2 instances and reach Postgres
      # over the VPC's private network — so on AWS this must NOT be loopback, or
      # nothing outside the web node can connect and the workers sit idle
      # forever with a connection error.
      #
      # Set DB_BIND to the web node's PRIVATE IP (never a public one), and let
      # the security group be the boundary: allow 5432 only from the pool and
      # bench security groups. Default stays loopback so a laptop is safe by
      # doing nothing.
      - "${DB_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mebench -d mebench"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    # Leaderboard read model only. Never a queue, never a source of truth, so
    # no persistence is configured: it is rebuilt from Postgres in one query.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
